openapi: 3.0.3
info:
    title: TODO API
    version: 1.0.0
    description: >
        API de gestion d'une TODO List.
servers:
    -   url: http://localhost:8080
        description: Serveur local de développement

tags:
    -   name: tasks
        description: Opérations sur les tâches

paths:
    /tasks:
        post:
            tags: [ tasks ]
            summary: Créer une tâche
            operationId: createTask
            requestBody:
                description: createDto
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateDto'
            responses:
                '201':
                    description: ReadDto
                    headers:
                        Location:
                            description: URL de la ressource créée
                            schema:
                                type: string
                                example: /tasks/1
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReadDto'
                '400':
                    description: Paramètre invalide
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorDto'
                '500':
                    description: Erreur interne du serveur
        # endpoint get All Task
        get:
            parameters:
                - in: query
                  name: todo-only
                  required: false
                  description: Indique s'il faut seulement récupérer les tâches à réaliser.
                  schema:
                      type: boolean
            tags: [ tasks ]
            summary: Récupérer toutes les tâches
            description: Récupérer toutes les tâches
            operationId: getAllTasks
            responses:
                '200':
                    description: tâches trouvées
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/ReadDto"
                '204':
                    description: no content
                '500':
                    description: Erreur interne du serveur



    /tasks/{id}:
        parameters:
            -   in: path
                name: id
                required: true
                description: Identifiant numérique de la tâche
                schema:
                    type: integer
                    minimum: 1
        get:
            tags: [ tasks ]
            summary: Récupérer une tâche
            description: Récupérer une tâche par son identifiant
            operationId: getTaskById
            responses:
                '200':
                    description: Tâche trouvée avec succès
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReadDto'
                '404':
                    description: Tâche non trouvée
                '500':
                    description: Erreur interne du serveur

        # endpoint delete a task
        delete:
            tags: [ tasks ]
            summary: Supprimer tâche
            description: Supprimer une tâche par son identifiant
            operationId: deleteTaskById
            responses:
                '204':
                    description: tâche supprimée avec succès
                '404':
                    description: tâche inexistante
                '500':
                    description: Erreur interne du serveur

        # endpoint edit a task
        put:
            tags: [ tasks ]
            summary: Modifier une tâche
            description: Modifier une tâche par son id
            operationId: putTaskById
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateDto'
            responses:
                '204':
                    description: tâche modifiée avec succès
                '404':
                    description: tâche non trouvée
                '400':
                    description: Paramètre invalide
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorDto'
                '500':
                    description: Erreur interne du serveur


components:
    schemas:
        CreateDto:
            type: object
            description: Données pour créer une tâche
            properties:
                title:
                    type: string
                    maxLength: 50
                    example: Acheter du lait
                description:
                    type: string
                    maxLength: 255
                    example: 2L demi-écrémé
            required:
                - title
                - description

        UpdateDto:
            type: object
            description: Données pour modifier une tâche
            properties:
                title:
                    type: string
                    maxLength: 50
                    example: Acheter du lait
                description:
                    type: string
                    maxLength: 255
                    example: 2L demi-écrémé
                done:
                    type: boolean
                    example: false
            required:
                - title
                - description
                - done

        ReadDto:
            type: object
            description: Représentation d'une tâche retournée par l'API
            properties:
                id:
                    type: integer
                    example: 1
                title:
                    type: string
                    example: Acheter du lait
                description:
                    type: string
                    example: 2L demi-écrémé
                done:
                    type: boolean
                    example: false
            required:
                - id
                - title
                - description
                - done

        ErrorDto:
            type: object
            description: Représentation d'une erreur de validation
            properties:
                field:
                    type: string
                    example: title
                message:
                    type: string
                    example: Le titre ne peut pas dépasser 50 caractères
            required:
                - field
                - message
